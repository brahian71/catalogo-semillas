<section class="hero-section">
  <div class="container">
    <div class="hero-content">
      <h1 class="hero-title">
        🥜 Los Mejores Productos Secos a Granel
      </h1>
      <p class="hero-subtitle">
        Descubre nuestra amplia variedad de frutos secos, semillas comestibles, granos, legumbres y alimentos deshidratados. 
        Productos de la más alta calidad para una alimentación saludable y natural.
      </p>
      <div class="hero-buttons">
        <a href="#catalogo" class="btn-primary" (click)="scrollToCatalogo($event)">Ver Catálogo</a>
        <button class="btn-secondary" (click)="contactarWhatsApp()">
          📱 Contactar WhatsApp
        </button>
      </div>
    </div>
  </div>
</section>
