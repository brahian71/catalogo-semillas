<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con esquinas redondeadas (estilo iOS) -->
  <rect width="180" height="180" rx="40" ry="40" fill="#2D5A27"/>
  
  <!-- Gradiente de fondo -->
  <defs>
    <radialGradient id="bgGradient" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" style="stop-color:#4A7C59;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2D5A27;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="180" height="180" rx="40" ry="40" fill="url(#bgGradient)"/>
  
  <!-- Contenedor/Bowl representando productos a granel -->
  <ellipse cx="90" cy="130" rx="50" ry="15" fill="#D2691E" opacity="0.8"/>
  <ellipse cx="90" cy="125" rx="50" ry="15" fill="#F4A460" opacity="0.9"/>
  
  <!-- Productos a granel (frutos secos, granos) - más grandes -->
  <circle cx="70" cy="115" r="8" fill="#8B4513" opacity="0.9"/>
  <circle cx="90" cy="110" r="6" fill="#CD853F" opacity="0.9"/>
  <circle cx="110" cy="115" r="8" fill="#A0522D" opacity="0.9"/>
  <circle cx="75" cy="125" r="5" fill="#D2691E" opacity="0.9"/>
  <circle cx="105" cy="125" r="6" fill="#B8860B" opacity="0.9"/>
  <circle cx="85" cy="105" r="5" fill="#BC8F8F" opacity="0.9"/>
  <circle cx="95" cy="120" r="5" fill="#DAA520" opacity="0.9"/>
  <circle cx="80" cy="118" r="4" fill="#DEB887" opacity="0.9"/>
  <circle cx="100" cy="108" r="4" fill="#F4A460" opacity="0.9"/>
  
  <!-- Texto "GV" estilizado -->
  <text x="90" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="#FFFFFF" opacity="0.9">GV</text>
        
  <!-- Hoja decorativa -->
  <ellipse cx="90" cy="45" rx="25" ry="12" fill="#8FBC8F" opacity="0.6"/>
  <ellipse cx="90" cy="42" rx="18" ry="8" fill="#9ACD32" opacity="0.7"/>
</svg>